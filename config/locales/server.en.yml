en:
  site_settings:
    category_lockdown_enabled: Enable discourse-category-lockdown?
    category_lockdown_list_icon: The fa-icon name to display next to topics which are locked down.
    category_lockdown_allow_crawlers: Allow crawlers to access locked content if "everyone can see" is enabled. Crawlers are identified by User-Agent only, which anyone can send, so on its own this exemption is advisory rather than enforced.
    category_lockdown_crawler_require_verified_ip: Additionally require crawler requests to come from an ASN listed in the "crawler asns" site setting. Closes the User-Agent bypass, but nothing qualifies as a crawler until "crawler asns" is populated.
    category_lockdown_crawler_noarchive: Add a 'noarchive' meta tag to disable search engine cache.
    category_lockdown_crawler_indicate_paywall: Add Schema.org metadata to indicate paywalled content.
