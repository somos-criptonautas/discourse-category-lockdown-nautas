es:
  site_settings:
    category_lockdown_enabled: "Activa el bloqueo de categorías. Cada categoría se configura en su pestaña de seguridad."
    category_lockdown_list_icon: "Icono (fa-icon) que aparece junto a los temas bloqueados."
    category_lockdown_allow_crawlers: "Deja que los buscadores lean el contenido bloqueado para poder indexarlo. Ojo: al buscador lo reconocemos solo por su User-Agent, y eso cualquiera lo puede falsificar."
    category_lockdown_crawler_noarchive: "Añade la metaetiqueta 'noarchive' para que los buscadores no guarden una copia en caché."
    category_lockdown_crawler_indicate_paywall: "Añade metadatos de Schema.org para avisar a los buscadores de que el contenido es de pago."
    category_lockdown_crawler_require_verified_ip: "Exige además que la visita venga de una red (ASN) de «crawler asns». Cierra el agujero del User-Agent, pero mientras «crawler asns» esté vacío no pasa ningún buscador y nadie indexa nada."
