es:
  site_settings:
    category_lockdown_enabled: "Activar discourse-category-lockdown."
    category_lockdown_list_icon: "Ícono (fa-icon) junto a las historias bloqueadas."
    category_lockdown_allow_crawlers: "Deja que los rastreadores lean el contenido bloqueado si «todos pueden ver» está activado. Se identifican solo por User-Agent, que cualquiera puede enviar: por sí sola es orientativa, no una restricción real."
    category_lockdown_crawler_require_verified_ip: "Exige además que los rastreadores vengan de un ASN de «crawler asns». Cierra el bypass del User-Agent, pero ningún rastreador pasa hasta que «crawler asns» tenga valores."
    category_lockdown_crawler_noarchive: "Agrega la metaetiqueta 'noarchive' para desactivar la caché de los buscadores."
    category_lockdown_crawler_indicate_paywall: "Agrega metadatos de Schema.org que indican contenido de pago."
